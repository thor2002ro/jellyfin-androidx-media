name: AndroidX Media3 FFmpeg Decoder / Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Install Android NDK
        shell: bash
        run: |
          ndk_version="$(sed -n 's/^androidNdkVersion=//p' gradle.properties | head -n 1)"
          test -n "${ndk_version}"
          sdkmanager "ndk;${ndk_version}"
          ndk_root="${ANDROID_SDK_ROOT}/ndk/${ndk_version}"
          test -d "${ndk_root}"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_VERSION=${ndk_version}" >> "${GITHUB_ENV}"
          echo "Using Android NDK ${ndk_version} from ${ndk_root}"
      - name: Build ffmpeg
        run: ./build.sh
      - name: Build extension and publish library locally
        run: ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal
