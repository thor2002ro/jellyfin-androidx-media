name: AndroidX Media3 FFmpeg Decoder / Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      - name: Detect Android NDK
        shell: bash
        run: |
          ndk_root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "${ndk_root}" || ! -d "${ndk_root}" ]]; then
            ndk_root="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%p\n' | sort -V | tail -n 1)"
          fi
          ndk_version="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "${ndk_root}/source.properties" | head -n 1)"
          test -n "${ndk_version}"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_VERSION=${ndk_version}" >> "${GITHUB_ENV}"
          echo "Using Android NDK ${ndk_version} from ${ndk_root}"
      - name: Build ffmpeg
        run: ./build.sh
      - name: Build extension and publish library locally
        run: ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal
