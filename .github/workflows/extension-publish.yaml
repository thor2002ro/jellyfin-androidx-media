name: AndroidX Media3 FFmpeg Decoder / Publish

on:
  push:
    tags:
      - v*
    branches:
      - master

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    environment: release
    if: ${{ contains(github.repository_owner, 'jellyfin') || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Install Android NDK
        shell: bash
        run: |
          ndk_version="$(sed -n 's/^androidNdkVersion=//p' gradle.properties | head -n 1)"
          test -n "${ndk_version}"
          sdkmanager "ndk;${ndk_version}"
          ndk_root="${ANDROID_SDK_ROOT}/ndk/${ndk_version}"
          test -d "${ndk_root}"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_VERSION=${ndk_version}" >> "${GITHUB_ENV}"
          echo "Using Android NDK ${ndk_version} from ${ndk_root}"
      - name: Build ffmpeg
        run: ./build.sh
      - name: Set JELLYFIN_VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "JELLYFIN_VERSION=$(echo ${GITHUB_REF#refs/tags/v} | tr / -)" >> $GITHUB_ENV
      - name: Build extension and publish library
        run: ./gradlew :media3-ffmpeg-decoder:publish closeAndReleaseSonatypeStagingRepository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
